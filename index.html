<style>
svg{display:block}
.brand svg,div>svg[viewBox='0 0 64 32']{width:100%;height:auto}
:root{--bg:#0f1115;--card:#181b22;--card2:#21252e;--line:#2b303b;--tx:#eef1f6;--mut:#9aa3b2;--acc:#ff5a1f;--acc2:#ffb020;--ok:#2ecc71;--warn:#f5b301;--bad:#ff4d4f;--blue:#3b82f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:'Barlow Condensed';font-weight:800;font-size:23px;letter-spacing:1.5px}
.brand b{color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151b;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 8px;font:600 11px Barlow;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.bottom button.on{color:var(--acc)}
nav.bottom svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.in{background:var(--card2);border-color:transparent;padding:10px;margin-bottom:8px}
h1,h2,h3{font-family:'Barlow Condensed';margin:0 0 8px;letter-spacing:.3px;line-height:1.1}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11px}.b{font-weight:700}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:700 14px Barlow;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn.full{width:100%}
.btn.danger{background:#3a1d1f;color:#ff8a8c}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px Barlow;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=range]{padding:0;accent-color:var(--acc);background:none;border:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat{background:var(--card2);border-radius:10px;padding:9px 10px}
.stat .v{font-family:'Barlow Condensed';font-size:25px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.ok{background:#14301f;color:#5fe39a}.pill.warn{background:#3a2f0c;color:#ffd257}.pill.bad{background:#3a1416;color:#ff8a8c}.pill.acc{background:#3a1d10;color:#ff9a6a}.pill.blue{background:#13233f;color:#8bb6ff}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card2);border-radius:8px;padding:4px 8px;margin:3px 4px 0 0;font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li.click{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;color:var(--acc);flex:none;font-family:'Barlow Condensed';font-size:17px}
table.x{border-collapse:collapse;width:100%;font-size:13px}
table.x td,table.x th{border:1px solid var(--line);padding:6px 7px;vertical-align:top;white-space:nowrap;text-align:left}
table.x th{color:var(--mut);font-weight:700;font-size:12px}
.tblwrap{overflow:auto;max-width:100%;border-radius:8px;max-height:70vh}
.kg{color:var(--acc2);font-weight:800}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 4px;border-radius:8px;font:700 13px Barlow;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 12px;border-radius:99px;font:700 13px Barlow;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 30px;border:1px solid var(--line)}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{min-height:46px;background:var(--card2);border-radius:8px;padding:5px;font-size:13px;position:relative;border:1px solid transparent;cursor:pointer;font-weight:600}
.cal .d.o{opacity:.3}.cal .d.t{border-color:var(--acc)}.cal .d.s{background:var(--acc);color:#fff}
.dots{position:absolute;bottom:5px;left:5px;display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-weight:700;z-index:70;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.banner{background:#2a2110;color:#ffd257;border:1px solid #4a3a12;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:700 15px Barlow;cursor:pointer}
.scale button.on{background:var(--acc);border-color:var(--acc)}
.bar{display:flex;align-items:center;justify-content:center;min-height:124px;overflow-x:auto;padding:6px 0}
.plate{border-radius:4px;margin:0 1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}.prog>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.empty{text-align:center;padding:26px 12px;color:var(--mut)}
img.plan{width:100%;border-radius:10px;display:block;margin-bottom:8px;cursor:zoom-in}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.thumbs button{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:0;border-radius:6px;width:22px;height:22px;cursor:pointer}
.big{font-family:'Barlow Condensed';font-size:52px;font-weight:800;line-height:1;color:var(--acc2)}
.back{background:none;border:0;color:var(--mut);font:700 14px Barlow;padding:4px 0 10px;cursor:pointer}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
video{width:100%;border-radius:10px;background:#000;margin-top:6px}
.note{background:#13233f;color:#cfe0ff;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:6px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:800;margin:4px 0 8px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--mut)}

body{background:radial-gradient(900px 500px at 100% -10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(255,90,31,.14),transparent 60%),radial-gradient(900px 600px at 50% 110%,rgba(6,182,212,.12),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.brand b{background:linear-gradient(90deg,var(--g1),var(--g2),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top{border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.06)}
header.top::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2),#8b5cf6,#3b82f6,#06b6d4,#2ecc71)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 14px rgba(255,61,90,.25)}
.btn.sec,.btn.ghost,.btn.danger{box-shadow:none}
.btn.sec{background:var(--card2)}
.card.cc{border-top:3px solid var(--cc);background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 13%,var(--card)) 0,var(--card) 120px)}
.card.cc h2,.card.cc h3,.card.cc .sec-t{color:color-mix(in srgb,var(--cc) 75%,#fff)}
.stat.lift{border-left:4px solid var(--lc);background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 18%,var(--card2)),var(--card2))}
.stat.lift .v{color:color-mix(in srgb,var(--lc) 55%,#fff)}
.stat.lift .l{color:color-mix(in srgb,var(--lc) 70%,#fff)}
nav.bottom button.on{color:var(--tc)}
nav.bottom button.on svg{filter:drop-shadow(0 0 6px var(--tc))}
.seg button.on,.tabs button.on,.scale button.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}

/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function ymd(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
const dt=s=>new Date(s+'T12:00:00');
const fmtD=(s,o)=>s?dt(s).toLocaleDateString('es-CL',o||{day:'numeric',month:'short'}):'';
const daysUntil=s=>Math.round((dt(s)-dt(ymd()))/864e5);
function mondayOf(s){const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function addDays(s,n){const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)}
const fk=n=>n==null||isNaN(n)?'—':(Math.round(n*10)/10).toString().replace('.',',');
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
let toastT;function toast(m){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=m;el.style.display='block';toastT=setTimeout(()=>el.style.display='none',2800)}

const EX=[{k:'arranque',n:'Arranque'},{k:'envion',n:'Envión'},{k:'cargada',n:'Clean'},{k:'jerk',n:'Jerk por delante'},{k:'sfrontal',n:'Sentadilla frontal'},{k:'strasera',n:'Sentadilla trasera'},
 {k:'tarranque',n:'Halón de arranque'},{k:'tenvion',n:'Halón de clean'},{k:'pushpress',n:'Empuje de fuerza'},
 {k:'arrfza',n:'Arranque de fuerza'},{k:'arrsop',n:'Arranque desde soportes'},{k:'arrparado',n:'Arranque parado'},{k:'arrcolg',n:'Arranque colgante'},{k:'finarr',n:'Final de arranque'},
 {k:'cleanparado',n:'Clean parado'},{k:'cleansop',n:'Clean desde soportes'},{k:'cleancolg',n:'Clean colgante'},{k:'empuje',n:'Empuje (desliz)'},
 {k:'jerkdet',n:'Jerk por detrás'},{k:'ohs',n:'Sentadilla overhead (OHS)'}];
const EXC={arranque:'#8b5cf6',envion:'#ff5a1f',cargada:'#f59e0b',jerk:'#ec4899',jerkdet:'#db2777',sfrontal:'#06b6d4',strasera:'#3b82f6',arrparado:'#7c3aed',arrfza:'#6366f1',arrsop:'#a855f7',finarr:'#c084fc',arrcolg:'#a855f7',cleancolg:'#eab308',ohs:'#0ea5e9',cleanparado:'#ea580c',cleansop:'#d97706',pushpress:'#22c55e',empuje:'#16a34a',tarranque:'#a78bfa',tenvion:'#fb923c'};
const AVC=['#8b5cf6','#ff5a1f','#06b6d4','#ec4899','#2ecc71','#f59e0b','#3b82f6'];const avc=n=>{let s=0;for(const c of String(n||''))s+=c.charCodeAt(0);return AVC[s%AVC.length]};
const EXN=Object.fromEntries(EX.map(e=>[e.k,e.n]));
function detectEx(t){t=norm(t);if(!t.trim())return null;
 if(/banca|mancuerna|cadera|tomada|balon|remo|plancha|elevacion/.test(t))return null;
 if(/(tiron|halon).*(arr|snatch)|snatch ?pull/.test(t))return'tarranque';
 if(/tiron|halon|clean ?pull|\bpull\b/.test(t))return'tenvion';
 if(/frontal|front/.test(t))return'sfrontal';
 if(/\bohs\b|overhead|sentadilla.*(arriba|brazos arriba)/.test(t))return'ohs';
 if(/sentadilla|squat|\bsent\b/.test(t))return'strasera';
 if(/envion|(clean|cargada).*(\+|&|\by\b|and).*(jerk|yerk)|c ?& ?j|\bcyj\b|dos tiempos/.test(t))return'envion';
 if(/final.*(arranque|arr\b)/.test(t))return'finarr';
 if(/(arranque|snatch|\barr\b).*(fuerza|fza|potencia|power)|power ?snatch/.test(t))return'arrfza';
 if(/(arranque|snatch|\barr\b).*(soporte|bloque|block)/.test(t))return'arrsop';
 if(/(arranque|snatch|\barr\b).*parad/.test(t))return'arrparado';
 if(/(arranque|snatch|\barr\b).*(colg|hang)|hang ?snatch/.test(t))return'arrcolg';
 if(/arranque|snatch|\barr\b/.test(t))return'arranque';
 if(/(cargada|clean).*(soporte|bloque|block)/.test(t))return'cleansop';
 if(/(cargada|clean).*parad/.test(t))return'cleanparado';
 if(/(cargada|clean).*(colg|hang)|hang ?clean/.test(t))return'cleancolg';
 if(/cargada|clean/.test(t))return'cargada';
 if(/empuje.*(fuerza|fza)|push ?press|press de empuje/.test(t))return'pushpress';
 if(/(jerk|yerk).*(detras|atras|nuca|behind)/.test(t))return'jerkdet';
 if(/jerk|yerk|split|tijera/.test(t))return'jerk';

 if(v){if(v.t==='plan')return h+vPlan(v.id);if(v.t==='planEdit')return h+vPlanEdit();if(v.t==='athlete')return h+vAthleteDetail(v.id)}
 if(role()==='athlete'&&!myA()&&!['tools','cal','more','rank'].includes(S.tab))return h+(S.loaded.athletes?vOnboard():'<div class="loading">Cargando…</div>');
 switch(S.tab){case'home':return h+vHome();case'team':return h+vTeam();case'plans':return h+vPlans();case'cal':return h+vCal();case'profile':return h+vProfile(S.me.id,false);case'tools':return h+vTools();case'rank':return h+vRank();case'more':return h+vMore()}
 return h}

/* ---------- onboarding ---------- */

/* ---------- inicio atleta ---------- */
function nextComp(){const t=ymd();return Object.entries(S.comps).map(([id,c])=>({id,...c})).filter(c=>c.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0]}

  let h=`<div class="uhero"><img src="${LOGO_SRC}" alt=""><div><div class="t1">HALTEROFILIA <b>USACH</b></div><div class="t2">Universidad de Santiago de Chile</div></div></div><h1>${isBday(a)?'¡Feliz cumpleaños':'Hola'}, ${esc((a.name||'').split(' ')[0])}${isBday(a)?'! 🎂':''}</h1><div class="mut sm" style="margin-bottom:12px">${fmtD(t,{weekday:'long',day:'numeric',month:'long'})} · ${ci?'Cat. '+ci.label:'Sin categoría'} · ${ageGroup(a.by)}${S.me.coachName?' · Profe '+esc(S.me.coachName):''}</div>`;
 h+=`<div class="card cc" style="--cc:#2ecc71"><div class="row sp"><div><div class="sec-t">Sensaciones de hoy</div>${w?`<div class="row"><span class="big" style="font-size:40px;color:var(--${r>=70?'ok':r>=50?'warn':'bad'})">${r??'—'}</span><div class="sm mut">disposición<br>sueño ${w.sueno}/5 · fatiga ${w.fatiga}/5 · dolor ${w.dolor||0}/10</div></div>`:'<div class="mut sm">Cuéntale al profe cómo llegas hoy (30 segundos).</div>'}</div><button class="btn ${w?'sec sm':''}" onclick="A.wellness()">${w?'Editar':'Registrar'}</button></div></div>`;
 h+=`<div class="grid3" style="margin-bottom:12px;cursor:pointer" title="Ver mi perfil" onclick="A.tab('profile')"><div class="stat lift" style="--lc:${EXC.arranque}"><div class="l">Arranque</div><div class="v">${fk(a.rms?.arranque)}</div></div><div class="stat lift" style="--lc:${EXC.envion}"><div class="l">Envión</div><div class="v">${fk(a.rms?.envion)}</div></div><div class="stat lift" style="--lc:#2ecc71"><div class="l">Total</div><div class="v">${total?fk(total):'—'}</div><div class="xs mut">${sc?'Sinclair '+fk(sc):''}</div></div></div>`;
 const vp=sortedPlans().filter(([id,p])=>planVisible(p,S.me.id));
 h+=`<div class="card cc" style="--cc:#ff5a1f"><div class="sec-t">Plani actual</div>${vp.length?planItem(vp[0][0],vp[0][1]):'<div class="mut sm">El profe aún no sube planificación.</div>'}</div>`;
 const c=nextComp();
 if(c){const d=daysUntil(c.date);const att=ATT.normal;h+=`<div class="card cc" style="--cc:#ec4899"><div class="row sp"><div class="sec-t">Próxima competencia</div><span class="pill acc">${d===0?'¡Hoy!':'en '+d+' días'}</span></div><div class="b">${esc(c.name)}</div><div class="sm mut">${fmtD(c.date,{day:'numeric',month:'long'})}${c.place?' · '+esc(c.place):''}</div>
  ${ci&&ci.limit&&a.bw?`<div class="sm" style="margin-top:6px">Peso ${fk(a.bw)} kg · límite ${ci.limit} kg ${a.bw>ci.limit?'<span class="pill bad">sobre el límite</span>':`<span class="pill ok">margen ${fk(ci.limit-a.bw)} kg</span>`}</div>`:''}
  ${a.rms?.arranque&&a.rms?.envion?`<div class="sm" style="margin-top:6px">Intentos sugeridos: arranque <b>${att.map(p=>rnd(a.rms.arranque*p/100,1)).join(' / ')}</b> · envión <b>${att.map(p=>rnd(a.rms.envion*p/100,1)).join(' / ')}</b></div>`:''}</div>`}
 const notes=Object.entries(S.logs).flatMap(([id,l])=>(l.coachNotes||[]).map(n=>({...n,log:l}))).sort((x,y)=>(y.ts||0)-(x.ts||0)).slice(0,3);
 if(notes.length)h+=`<div class="card cc" style="--cc:#06b6d4"><div class="sec-t">Comentarios del profe</div>${notes.map(n=>`<div class="note"><div class="xs" style="opacity:.7">${fmtD(n.log.d)} · ${esc(n.log.sName||'Entrenamiento')}</div>${esc(n.text)}</div>`).join('')}</div>`;

/* ---------- equipo (profe) ---------- */
function alertsFor(a){const out=[];const t=ymd();const ws=(a.wellness||[]).slice().sort((x,y)=>y.d.localeCompare(x.d));const w=ws.find(x=>x.d===t);
 if(w){if((w.dolor||0)>=5)out.push(['bad',`Dolor ${w.dolor}/10${w.zona?' ('+w.zona+')':''}`]);const r=readiness(w);if(r!=null&&r<50)out.push(['warn','Baja disposición hoy'])}
 if(ws.length>=2&&ws[0].sueno<=2&&ws[1].sueno<=2&&daysUntil(ws[1].d)>=-3)out.push(['warn','Duerme mal hace días']);
 const ll=(a.lastLogs||[]).slice().sort((x,y)=>y.d.localeCompare(x.d));
 if(ll.length&&daysUntil(ll[0].d)<-7)out.push(['','Sin entrenos en 7 días']);
 const r3=ll.slice(0,3).filter(l=>l.rpe);if(r3.length===3&&r3.reduce((s,l)=>s+l.rpe,0)/3>=9)out.push(['warn','RPE muy alto']);
 const c=nextComp();const ci=catInfo(a);if(c&&ci&&ci.limit&&a.bw>ci.limit&&daysUntil(c.date)<=21)out.push(['bad',`+${fk(a.bw-ci.limit)} kg sobre su categoría`]);
 return out}
function weekCount(a){const m=mondayOf(ymd());return(a.lastLogs||[]).filter(l=>l.d>=m).length}
function vTeam(){const list=athleteList();const t=ymd();const orphans=Object.entries(S.athletes).filter(([i,a])=>!a.coach);
 let h=`<div class="row" style="gap:12px;margin-bottom:12px"><div style="width:64px;flex:none">${LOGO}</div><div><div class="sec-t" style="margin:0">Halterofilia USACH</div><div class="b" style="font-size:18px">Universidad de Santiago de Chile</div></div></div><div class="row sp"><div><h1 style="margin:0">Mi equipo</h1><div class="sm mut">Profe ${esc(S.me.name)}</div></div><button class="btn sm" onclick="A.addAthlete()">+ Atleta</button></div>`;
 const al=list.map(([id,a])=>[id,a,alertsFor(a)]).filter(x=>x[2].length);
 if(al.length)h+=`<div class="card cc" style="--cc:#ff4d4f"><div class="sec-t">Alertas</div>${al.map(([id,a,x])=>`<div class="li click" onclick="A.open('athlete','${id}')"><div class="av" style="background:${avc(a.name)}26;color:${avc(a.name)}">${esc(initials(a.name))}</div><div class="f1"><div class="b">${esc(a.name)}</div><div>${x.map(([c,m])=>`<span class="pill ${c}">${esc(m)}</span>`).join(' ')}</div></div></div>`).join('')}</div>`;
 h+=`<div class="card cc" style="--cc:#8b5cf6">${list.length?list.map(([id,a])=>{const w=(a.wellness||[]).find(x=>x.d===t);const r=readiness(w);const ci=catInfo(a);const tot=(a.rms?.arranque||0)+(a.rms?.envion||0);const coach=id[0]==='c';const vid=(a.lastLogs||[]).filter(l=>l.v&&daysUntil(l.d)>=-7).reduce((s,l)=>s+l.v,0);
  return`<div class="li click" onclick="A.open('athlete','${id}')"><div class="av" style="background:${avc(a.name)}26;color:${avc(a.name)}">${esc(initials(a.name))}</div><div class="f1"><div class="b">${esc(a.name)}${isBday(a)?' 🎂':''} ${coach?'<span class="pill acc">profe</span>':''}${a.manual?'<span class="pill">sin cuenta</span>':''}${vid?` <span class="pill blue">🎥 ${vid}</span>`:''}</div><div class="sm mut">${ci?ci.label:'—'} · Total ${tot?fk(tot):'—'} · ${weekCount(a)} entrenos esta semana</div></div>${r!=null?`<span class="pill ${rdClass(r)}">${r}</span>`:'<span class="pill">sin check-in</span>'}</div>`}).join(''):`<div class="empty">Aún no hay atletas.<br><br>Comparte el link de la app: cada atleta se registra con su nombre y un PIN.<br>También puedes agregar atletas a mano con “+ Atleta”.</div>`}</div>`;
 if(orphans.length)h+=`<div class="card cc" style="--cc:#f59e0b"><div class="sec-t">Atletas sin profe asignado</div><div class="sm mut" style="margin-bottom:6px">Son de antes de separar los equipos. Agrégalos al tuyo si son tus alumnos.</div>${orphans.map(([id,a])=>`<div class="li"><div class="av" style="background:${avc(a.name)}26;color:${avc(a.name)}">${esc(initials(a.name))}</div><div class="f1 b">${esc(a.name)}</div><button class="btn sm" onclick="A.claim('${id}')">Agregar a mi equipo</button></div>`).join('')}</div>`;
 h+=`<div class="card sm mut"><b style="color:var(--tx)">Cómo sumar atletas:</b> agrégalos con “+ Atleta” y ponles un PIN, o mándales el link para que toquen <b>Registrarme</b> y te elijan como profe. Cada profe ve solo a sus atletas, sus planis y sus registros.</div>`;
 h+=`<div class="card cc" style="--cc:#06b6d4"><div class="sec-t">Profes</div>${(S.coaches||[]).map(c=>`<span class="chip">${esc(c.name)}${c.id===S.me.id?' (tú)':''}</span>`).join('')}
  <div class="row wrap" style="margin-top:10px"><button class="btn sm sec" onclick="A.newCoach()">+ Crear profe</button><button class="btn sm ghost" onclick="A.myPass()">Cambiar mi contraseña</button></div></div>`;
 return h}

/* ---------- detalle atleta (profe) ---------- */

 h+=`<div class="card row sp"><div class="sm mut">${a.manual?'Atleta sin cuenta, administrado por el profe.':id===S.me.id?'Este es tu propio perfil de atleta. Al eliminarlo se borran tu perfil y tus registros, pero sigues entrando como profe.':'Eliminar al atleta borra su perfil, sus entrenamientos y su cuenta (nombre y PIN).'}</div><button class="btn sm danger" onclick="A.delAthlete('${id}')">${S.confirm==='da'+id?'¿Seguro? Toca otra vez':'Eliminar atleta'}</button></div>`;

/* ---------- perfil ---------- */
function vProfile(id,coachMode){const a=S.athletes[id];if(!a)return'';const step=a.step||1;
 const total=(a.rms?.arranque||0)+(a.rms?.envion||0);const sc=sinclair(total,a.bw,a.sex);const ci=catInfo(a);
 let h=`<div class="card cc" style="--cc:#ff5a1f"><div class="row sp" style="align-items:flex-start"><div class="row"><div class="av" style="width:48px;height:48px;font-size:20px">${esc(initials(a.name))}</div><div><h2 style="margin:0">${esc(a.name)}</h2><div class="mut sm">${a.sex==='F'?'Femenino':a.sex==='M'?'Masculino':''}${ageOf(a)!=null?' · '+ageOf(a)+' años':''}${a.dob?' · '+fmtD(a.dob,{day:'numeric',month:'short',year:'numeric'}):''}${isBday(a)?' 🎂':''} · ${ageGroup(a.by)}</div></div></div><button class="btn sm sec" onclick="A.editProfile('${id}')">Editar</button></div>
 <div class="grid3" style="margin-top:12px"><div class="stat"><div class="l">Peso</div><div class="v">${fk(a.bw)}</div><div class="xs mut">${ci?'Cat. '+ci.label:''}</div></div><div class="stat"><div class="l">Total</div><div class="v">${total?fk(total):'—'}</div></div><div class="stat"><div class="l">Sinclair</div><div class="v">${sc?fk(Math.round(sc*10)/10):'—'}</div></div></div></div>`;
 h+=insightsHTML(id)+barHistHTML(id)+badgesHTML(id)+compHistHTML(id);
 h+=`<div class="card cc" style="--cc:#8b5cf6"><div class="row sp"><h3>Récords (RM)</h3><span class="xs mut">toca uno para agregar PR o ver %</span></div><div class="grid2">${EX.map(e=>{const pts=(a.rmHist||[]).filter(p=>p.ex===e.k).sort((x,y)=>x.d.localeCompare(y.d)).map(p=>({x:p.d,y:p.kg}));const last=pts[pts.length-1];
  return`<div class="stat lift" style="cursor:pointer;--lc:${EXC[e.k]}" onclick="A.pctTable('${id}','${e.k}')"><div class="l">${e.n}</div><div class="row sp"><div class="v">${fk(a.rms?.[e.k])}<span class="xs mut"> kg</span></div><div class="xs mut">${last?fmtD(last.x):''}</div></div>${pts.length>=2?spark(pts,{h:28,color:EXC[e.k]}):''}</div>`}).join('')}</div></div>`;
 // proyecciones
 const PJ=['arranque','envion','sfrontal','strasera'];const g=a.goals||{};
 let pTot=0,pOk=true;
 h+=`<div class="card cc" style="--cc:#f59e0b"><div class="row sp"><h3>Proyecciones y objetivos</h3><button class="btn sm sec" onclick="A.goals('${id}')">Objetivos</button></div>${PJ.map(ex=>{const p=project(a,ex);if(!p)return'';const goal=g[ex];
  if(ex==='arranque'||ex==='envion'){if(p.p12)pTot+=p.p12;else if(p.cur)pTot+=p.cur;else pOk=false}
  let eta='';if(goal&&p.slope>0&&goal>p.cur){const days=(goal-p.cur)/p.slope;eta=`a este ritmo: ${fmtD(addDays(ymd(),Math.round(days)),{month:'short',year:'numeric'})}`}
  return`<div class="li" style="display:block"><div class="row sp"><b>${EXN[ex]}</b><span class="sm">${fk(p.cur)} kg${p.slope!=null?` · <span style="color:${p.slope>=0?'var(--ok)':'var(--bad)'}">${p.slope>=0?'+':''}${fk(p.slope*30)} kg/mes</span>`:''}</span></div>
  <div class="sm mut">${p.p12?`En 12 semanas ≈ <b class="kg">${fk(p.p12)} kg</b>`:'Registra más RM para calcular la tendencia'}${goal?` · objetivo <b style="color:var(--tx)">${fk(goal)} kg</b>${g.date?' para el '+fmtD(g.date):''}`:''}</div>
  ${goal?`<div class="prog"><i style="width:${Math.min(100,p.cur/goal*100)}%"></i></div><div class="xs mut" style="margin-top:3px">${Math.round(p.cur/goal*100)}% del objetivo${eta?' · '+eta:''}</div>`:''}</div>`}).join('')||'<div class="mut sm">Ingresa tus RM para ver proyecciones.</div>'}
  ${pOk&&pTot&&a.bw?`<div class="stat" style="margin-top:8px"><div class="l">Total proyectado (12 semanas)</div><div class="v">${fk(pTot)} kg <span class="sm mut">· Sinclair ${fk(Math.round(sinclair(pTot,a.bw,a.sex)*10)/10)}</span></div></div>`:''}</div>`;
 // ratios
 const rr=RATIOS.filter(([x,y])=>a.rms?.[x]&&a.rms?.[y]);
 h+=`<div class="card cc" style="--cc:#06b6d4"><h3>Relaciones entre levantamientos</h3>${rr.length?rr.map(([x,y,n,lo,hi,mLo,mHi])=>{const v=a.rms[x]/a.rms[y]*100;const st=v<lo?'warn':v>hi?'warn':'ok';return`<div class="li" style="display:block"><div class="row sp"><span>${n}</span><span><b>${Math.round(v)}%</b> <span class="pill ${st}">${v<lo?'bajo':v>hi?'alto':'ok'}</span></span></div><div class="xs mut">Referencia ${lo}–${hi}%${v<lo?' · '+mLo:v>hi?' · '+mHi:''}</div></div>`}).join('')+'<div class="xs mut" style="margin-top:6px">Rangos de referencia aproximados; el profe decide.</div>':'<div class="mut sm">Ingresa más RM (arranque, envión, sentadillas, clean y jerk) para comparar.</div>'}</div>`;
 // peso corporal
 const bwp=(a.bwHist||[]).slice().sort((x,y)=>x.d.localeCompare(y.d)).map(p=>({x:p.d,y:p.kg}));
 h+=`<div class="card cc" style="--cc:#3b82f6"><div class="row sp"><h3>Peso corporal</h3><span class="sm">${fk(a.bw)} kg${ci&&ci.limit?` · límite ${ci.limit}`:''}</span></div>${spark(bwp,{h:70,color:'#3b82f6',ref:ci&&ci.limit&&bwp.length>=2?ci.limit:null})}${ci&&ci.limit?'<div class="xs mut">Línea roja: límite de la categoría.</div>':''}</div>`;
 // sensaciones
 const ws=(a.wellness||[]).slice().sort((x,y)=>x.d.localeCompare(y.d));const rp=ws.slice(-21).map(w=>({x:w.d,y:readiness(w)})).filter(p=>p.y!=null);
 h+=`<div class="card cc" style="--cc:#2ecc71"><div class="row sp"><h3>Sensaciones</h3>${!coachMode?`<button class="btn sm sec" onclick="A.wellness()">+ Hoy</button>`:''}</div>${spark(rp,{h:60,color:'#2ecc71'})}
  ${ws.length?`<div class="tblwrap" style="margin-top:8px"><table class="x"><tr><th>Fecha</th><th>Disp.</th><th>Sueño</th><th>Fatiga</th><th>Dolor</th><th>Motiv.</th><th>Nota</th></tr>${ws.slice(-10).reverse().map(w=>{const r=readiness(w);return`<tr><td>${fmtD(w.d)}</td><td><span class="pill ${rdClass(r)}">${r??'—'}</span></td><td>${w.sueno??'—'}</td><td>${w.fatiga??'—'}</td><td>${w.dolor||0}${w.zona?' · '+esc(w.zona):''}</td><td>${w.motiv??'—'}</td><td>${esc(w.nota||'')}</td></tr>`}).join('')}</table></div>`:'<div class="mut sm">Sin registros.</div>'}</div>`;
 // carga semanal
 const weeks={};(a.lastLogs||[]).forEach(l=>{const m=mondayOf(l.d);(weeks[m]=weeks[m]||[]).push(l)});const wk=Object.keys(weeks).sort().reverse().slice(0,6);

 // historial
 h+=`<div class="card cc" style="--cc:#ec4899"><div class="row sp"><h3>Entrenamientos</h3>${!coachMode?`<button class="btn sm sec" onclick="A.logNew()">+ Registrar</button>`:''}</div>${S.logsUid!==id||!S.logsLoaded?'<div class="mut sm">Cargando…</div>':logsHTML(id,coachMode)}</div>`;
 return h}

function renderSheet(sh,a){if(!sh)return'';const rows=sh.rows||[];const pctCols=new Set();rows.slice(0,3).forEach(r=>(r.c||[]).forEach((v,i)=>{const n=norm(v).trim();if(n==='%'||/porcent|intensidad/.test(n))pctCols.add(i)}));let last=null;
 const body=rows.map(r=>{const c=r.c||[];const ex=detectEx(c.join(' '));if(ex)last=ex;else if((c[0]||'').trim())last=null;const base=ex||last;
  return`<tr><td>${base?`<span class="pill">${EXN[base]}</span>`:''}</td>${c.map((v,i)=>`<td>${annot(v,base,pctCols.has(i),a)}</td>`).join('')}</tr>`}).join('');
 return`<div class="tblwrap"><table class="x"><tr><th class="xs">Base %</th>${(rows[0]?.c||[]).map((_,i)=>`<th class="xs">${String.fromCharCode(65+(i%26))}</th>`).join('')}</tr>${body}</table></div>`}
function annot(v,base,isPctCol,a){let h=esc(v);if(!base||!a)return h;const rm=a.rms?.[base];if(!rm)return h;let hit=false;const st=a.step||1;
 h=h.replace(/(\d{2,3}(?:[.,]\d+)?)\s*%/g,(m,p)=>{const pc=parseFloat(p.replace(',','.'));if(pc<30||pc>120)return m;hit=true;return`${m} <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`});
 if(!hit)h=h.replace(/\b(\d{2,3})\s*\/\s*(\d{1,2})\b/g,(m,p)=>{const pc=+p;if(pc<40||pc>110)return m;hit=true;return`${m} <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`});
 if(!hit&&isPctCol){const n=num(v);if(n!=null){const pc=n<=1.2?n*100:n;if(pc>=30&&pc<=120)h+=` <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`}}
 return h}

 if((p.sheets||[]).length){const si=Math.min(S.sheetIdx,p.sheets.length-1);h+=`<div class="card cc" style="--cc:#2ecc71"><div class="sec-t">Plani del Excel</div>${p.sheets.length>1?`<div class="tabs">${p.sheets.map((s,i)=>`<button class="${i===si?'on':''}" onclick="S.sheetIdx=${i};render()">${esc(s.name)}</button>`).join('')}</div>`:''}${renderSheet(p.sheets[si],a)}<div class="xs mut" style="margin-top:6px">Los kilos se calculan con los RM ${a?'de '+esc(a.name):''} según el ejercicio detectado en cada fila.</div></div>`}
 if(!p.weekly)(p.sessions||[]).forEach((s,si)=>{const all=[];const done=!c&&a&&(a.lastLogs||[]).some(l=>l.planId===id&&l.s===si);

  ${(s.items||[]).map(it=>{const t=parseScheme(it.scheme);all.push(...t);return`<div class="li" style="display:block"><div class="row sp"><b>${esc(it.name||'—')}</b>${it.base?`<span class="pill">% ${EXN[it.base]}</span>`:''}</div><div>${t.length?t.map(x=>{const kg=it.base&&a?kgOf(a,it.base,x.pct):null;return`<span class="chip">${fk(x.pct)}% × ${x.reps}${x.sets>1?' × '+x.sets:''}${kg!=null?` <b class="kg">${fk(kg)} kg</b>`:''}</span>`}).join(''):`<span class="sm">${esc(it.scheme||'')}</span>`}</div>${it.notes?`<div class="sm mut" style="margin-top:3px">${esc(it.notes)}</div>`:''}</div>`}).join('')}
  ${all.length?`<div class="xs mut" style="margin-top:6px">NL ${schemeStats(all).nl} · intensidad media ${schemeStats(all).im}%</div>`:''}</div>`});
 if(!c)h+=`<button class="btn full sec" onclick="A.logNew('${id}')">+ Registrar otro entrenamiento</button>`;

function qcRes(a){const q=S.qc;if(!a)return'<div class="mut sm">No hay atleta seleccionado.</div>';const rm=a.rms?.[q.ex];if(!rm)return`<div class="mut sm">Sin RM de ${EXN[q.ex]}.</div>`;const kg=rnd(rm*q.pct/100,a.step||1);return`<div class="row"><span class="big" style="font-size:38px">${fk(kg)}</span><span class="mut sm">kg = ${fk(q.pct)}% de ${fk(rm)}</span></div>${plateHTML(kg,a.sex==='F'?15:20,true)}`}

function vCal(){const c=role()==='coach';const [Y,M]=S.calMonth.split('-').map(Number);const first=new Date(Y,M-1,1);const off=(first.getDay()+6)%7;const dim=new Date(Y,M,0).getDate();const t=ymd();
  const byDate={};Object.entries(S.comps).forEach(([id,x])=>{(byDate[x.date]=byDate[x.date]||[]).push(id)});
  let cells='';const startD=new Date(Y,M-1,1-off);const n=Math.ceil((off+dim)/7)*7;
  for(let i=0;i<n;i++){const d=new Date(startD);d.setDate(startD.getDate()+i);const ds=ymd(d);const e=byDate[ds];const out=d.getMonth()!==M-1;
   cells+=`<div class="d ${out?'o':''} ${ds===t?'t':''} ${ds===S.calSel?'s':''} ${e?'cp':''}" onclick="S.calSel='${ds}';${out?`S.calMonth='${ds.slice(0,7)}';`:''}render()"><div>${d.getDate()}</div><div class="dots">${e?'<i class="dot" style="background:var(--acc)"></i>':''}</div></div>`}
  const mName=first.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
  let h=`<div class="row sp"><h1>Competencias</h1>${c?`<button class="btn sm" onclick="A.compNew()">+ Competencia</button>`:''}</div>`;
  const cs=Object.entries(S.comps).filter(([id,x])=>x.date>=t).sort((a,b)=>a[1].date.localeCompare(b[1].date));
  if(cs.length)h+=`<div class="card cc" style="--cc:#f07c1f"><div class="sec-t">Próximas competencias</div>${cs.map(([id,x])=>`<div class="li click" onclick="S.calSel='${x.date}';S.calMonth='${x.date.slice(0,7)}';render()"><div class="f1"><b>${esc(x.name)}</b><div class="sm mut">${fmtD(x.date,{day:'numeric',month:'long'})}${x.place?' · '+esc(x.place):''}</div></div><span class="pill acc">${daysUntil(x.date)===0?'¡Hoy!':daysUntil(x.date)+' días'}</span></div>`).join('')}</div>`;
  h+=`<div class="card cc" style="--cc:#4f8fe8"><div class="row sp" style="margin-bottom:8px"><button class="btn sm ghost" onclick="A.mon(-1)">‹</button><b>${mName[0].toUpperCase()+mName.slice(1)}</b><button class="btn sm ghost" onclick="A.mon(1)">›</button></div>
  <div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
  <div class="row wrap xs mut" style="margin-top:8px;gap:12px"><span><i class="dot" style="background:var(--acc)"></i> competencia</span></div></div>`;
  const e=byDate[S.calSel]||[];
  h+=`<div class="card cc" style="--cc:#1fb5b0"><h3>${(x=>x[0].toUpperCase()+x.slice(1))(fmtD(S.calSel,{weekday:'long',day:'numeric',month:'long'}))}</h3>`;
  e.forEach(id=>{const x=S.comps[id];const R=Object.entries(x.results||{}).filter(([u])=>S.athletes[u]).sort((a,b)=>compTot(b[1])-compTot(a[1]));h+=`<div class="li" style="align-items:flex-start"><span class="pill acc">🏆</span><div class="f1"><b>${esc(x.name)}</b><div class="sm mut">${esc(x.place||'')}${x.notes?' · '+esc(x.notes):''}</div>${R.length?`<div style="margin-top:6px">${R.map(([u,r])=>`<div class="sm${c?' click':''}" style="padding:3px 0;${c?'cursor:pointer':''}" ${c?`onclick="A.compRes('${id}','${u}')"`:''}>${medal(r.place)} <b>${esc(S.athletes[u].name)}</b> · ${compTot(r)?fk(compBest(r,'sn'))+' / '+fk(compBest(r,'cj'))+' = <b>'+fk(compTot(r))+' kg</b>':'inscrito'}${r.place?' · '+r.place+'° lugar':''}</div>`).join('')}</div>`:''}${c?`<div class="row" style="gap:6px;margin-top:8px"><button class="btn sm sec" onclick="A.compRes('${id}','')">+ Resultado / inscrito</button><button class="btn sm danger" onclick="A.delComp('${id}')">${S.confirm==='dc'+id?'¿Seguro?':'Borrar'}</button></div>`:''}</div></div>`});
  if(!e.length)h+=`<div class="mut sm">${c?'No hay competencias este día. Crea una con “+ Competencia”.':'No hay competencias este día.'}</div>`;
  return h+'</div>'}

function vTools(){const T=S.tools;const c=role()==='coach';
 const tabs=[['pct','% del RM'],['plates','Discos'],['att','Intentos'],['sin','Sinclair'],['est','RM estimado']];
 let h=`<h1>Herramientas</h1><div class="tabs">${tabs.map(([k,l])=>`<button class="${T.tab===k?'on':''}" onclick="S.tools.tab='${k}';render()">${l}</button>`).join('')}</div><div class="card">`;
 const srcSel=()=>`<label style="margin-top:0">RM de</label><select onchange="S.tools.src=this.value;A.prefill();render()">${!c&&myA()?`<option value="me" ${T.src==='me'?'selected':''}>Mis RM</option>`:''}${c?athleteList().map(([u,x])=>`<option value="${u}" ${T.src===u?'selected':''}>${esc(x.name)}</option>`).join(''):''}<option value="manual" ${T.src==='manual'?'selected':''}>Ingresar a mano</option></select>`;
 if(T.tab==='pct'){const a=toolAth();h+=`${srcSel()}<div class="grid2"><div><label>Ejercicio</label><select onchange="S.tools.ex=this.value;render()">${EX.map(e=>`<option value="${e.k}" ${e.k===T.ex?'selected':''}>${e.n}</option>`).join('')}</select></div><div><label>RM (kg)</label>${a?`<input value="${fk(a.rms?.[T.ex])}" disabled>`:`<input type="number" inputmode="decimal" value="${esc(T.rm)}" oninput="S.tools.rm=this.value;A.toolUpd()">`}</div></div>
  <label>Porcentaje: <span id="pctl">${T.pct}</span>%</label><input type="range" min="30" max="110" step="1" value="${T.pct}" oninput="S.tools.pct=+this.value;$('#pctl').textContent=this.value;A.toolUpd()">`}
 if(T.tab==='plates')h+=`<label style="margin-top:0">Peso total (kg)</label><input type="number" inputmode="decimal" value="${esc(T.target)}" oninput="S.tools.target=this.value;A.toolUpd()"><label>Barra</label><div class="seg">${[20,15,10,5].map(b=>`<button class="${T.bar===b?'on':''}" onclick="S.tools.bar=${b};render()">${b} kg</button>`).join('')}</div><label class="row" style="text-transform:none;font-size:14px;color:var(--tx)"><input type="checkbox" ${T.collars?'checked':''} onchange="S.tools.collars=this.checked;A.toolUpd()"> Seguros de competencia (2,5 kg c/u)</label>`;
 if(T.tab==='att')h+=`${srcSel()}<div class="grid2"><div><label>RM arranque</label><input type="number" inputmode="decimal" value="${esc(T.sn)}" oninput="S.tools.sn=this.value;A.toolUpd()"></div><div><label>RM envión</label><input type="number" inputmode="decimal" value="${esc(T.cj)}" oninput="S.tools.cj=this.value;A.toolUpd()"></div></div><label>Estrategia</label><div class="seg">${Object.keys(ATT).map(k=>`<button class="${T.att===k?'on':''}" onclick="S.tools.att='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`;
 if(T.tab==='sin')h+=`<div class="grid2"><div><label style="margin-top:0">Total (kg)</label><input type="number" inputmode="decimal" value="${esc(T.sTot)}" oninput="S.tools.sTot=this.value;A.toolUpd()"></div><div><label style="margin-top:0">Peso corporal</label><input type="number" inputmode="decimal" value="${esc(T.sBw)}" oninput="S.tools.sBw=this.value;A.toolUpd()"></div></div><label>Sexo</label><div class="seg"><button class="${T.sSex==='M'?'on':''}" onclick="S.tools.sSex='M';render()">Masculino</button><button class="${T.sSex==='F'?'on':''}" onclick="S.tools.sSex='F';render()">Femenino</button></div>`;
 if(T.tab==='est')h+=`<div class="grid2"><div><label style="margin-top:0">Kilos levantados</label><input type="number" inputmode="decimal" value="${esc(T.eKg)}" oninput="S.tools.eKg=this.value;A.toolUpd()"></div><div><label style="margin-top:0">Repeticiones</label><input type="number" inputmode="numeric" value="${esc(T.eReps)}" oninput="S.tools.eReps=this.value;A.toolUpd()"></div></div>`;
 h+=`<div id="toolres" style="margin-top:14px">${toolRes()}</div></div>`;return h}
function toolRes(){const T=S.tools;
 if(T.tab==='pct'){const a=toolAth();const rm=a?a.rms?.[T.ex]:num(T.rm);const st=a?.step||1;if(!rm)return`<div class="mut sm">${a?'Este atleta no tiene RM de '+EXN[T.ex]+'.':'Ingresa el RM.'}</div>`;const kg=rnd(rm*T.pct/100,st);
  return`<div style="text-align:center"><div class="big">${fk(kg)} kg</div><div class="mut sm">${T.pct}% de ${fk(rm)} kg</div></div>${plateHTML(kg,a?.sex==='F'?15:20,true)}<div class="tblwrap" style="margin-top:10px"><table class="x"><tr><th>%</th><th>kg</th><th>%</th><th>kg</th></tr>${[50,55,60,65,70,75,80,85].map(p=>`<tr><td>${p}%</td><td class="kg">${fk(rnd(rm*p/100,st))}</td><td>${p+40>110?'':p+40+'%'}</td><td class="kg">${p+40>110?'':fk(rnd(rm*(p+40)/100,st))}</td></tr>`).join('')}</table></div>`}
 if(T.tab==='plates'){const v=num(T.target);return v?plateHTML(v,T.bar,T.collars):'<div class="mut sm">Ingresa un peso.</div>'}
 if(T.tab==='att'){const sn=num(T.sn),cj=num(T.cj);const P=ATT[T.att];if(!sn&&!cj)return'<div class="mut sm">Ingresa los RM.</div>';
  const r=x=>x?P.map(p=>Math.round(x*p/100)):['—','—','—'];const s=r(sn),j=r(cj);
  return`<table class="x"><tr><th></th><th>1°</th><th>2°</th><th>3°</th></tr><tr><td>Arranque</td>${s.map(x=>`<td class="kg">${x}</td>`).join('')}</tr><tr><td>Envión</td>${j.map(x=>`<td class="kg">${x}</td>`).join('')}</tr></table><div class="sm" style="margin-top:8px">Total si sale todo: <b>${(sn?s[2]:0)+(cj?j[2]:0)} kg</b> · total asegurado con aperturas: <b>${(sn?s[0]:0)+(cj?j[0]:0)} kg</b></div><div class="xs mut" style="margin-top:4px">${P.join('% / ')}% del RM. Ajusta según cómo se sienta el atleta en el calentamiento.</div>`}
 if(T.tab==='sin'){const t=num(T.sTot),b=num(T.sBw);if(!t||!b)return'<div class="mut sm">Ingresa total y peso.</div>';const s=sinclair(t,b,T.sSex);return`<div style="text-align:center"><div class="big">${fk(Math.round(s*10)/10)}</div><div class="mut sm">puntos Sinclair · coeficiente ${(s/t).toFixed(4)}</div></div><div class="xs mut" style="margin-top:8px">Coeficientes IWF 2021–2024 (los del ciclo 2025–2028 aún no se publican completos).</div>`}
 if(T.tab==='est'){const k=num(T.eKg),r=num(T.eReps);if(!k||!r)return'<div class="mut sm">Ingresa kilos y repeticiones.</div>';const ep=r===1?k:k*(1+r/30),br=r===1?k:k*36/(37-r);const e=(ep+br)/2;
  return`<div style="text-align:center"><div class="big">${fk(Math.round(e*2)/2)} kg</div><div class="mut sm">RM estimado (promedio Epley y Brzycki)</div></div><div class="xs mut" style="margin-top:8px">${r>5?'Con más de 5 repeticiones la estimación es poco confiable. ':''}Sirve más para sentadillas y tirones que para arranque y envión, que dependen mucho de la técnica.</div>`}
 return''}

  <div class="row" style="margin-top:16px"><button class="btn f1" onclick="A.saveProfile()">Guardar</button><button class="btn ghost" onclick="A.closeModal()">Cancelar</button></div>`;
 if(m.t==='wellness')return`<h2>Sensaciones de hoy</h2><div class="sm mut">${fmtD(v.d,{weekday:'long',day:'numeric',month:'long'})}</div>
  <label>Sueño (1 muy mal · 5 excelente)</label>${scaleBtns('sueno',1,5)}
  <label>Fatiga (1 fresco · 5 muy cansado)</label>${scaleBtns('fatiga',1,5)}

  <label>Dolor (0 nada · 10 máximo)</label>${scaleBtns('dolor',0,10)}
  ${v.dolor>0?`<label>¿Dónde?</label><input value="${esc(v.zona)}" placeholder="Ej: rodilla derecha, lumbar" oninput="S.modal.v.zona=this.value">`:''}
  <div class="grid2"><div><label>Peso de hoy (opcional)</label><input type="number" inputmode="decimal" step="0.1" value="${esc(v.bw??'')}" oninput="S.modal.v.bw=num(this.value)"></div></div>
  <label>Nota para el profe</label><input value="${esc(v.nota)}" placeholder="Opcional" oninput="S.modal.v.nota=this.value">
  <div class="row" style="margin-top:16px"><button class="btn f1" onclick="A.saveWellness()">Guardar</button><button class="btn ghost" onclick="A.closeModal()">Cancelar</button></div>`;
 if(m.t==='log'){const a=myA();return`<h2>${esc(v.sName||'Registrar entrenamiento')}</h2><label>Fecha</label><input type="date" value="${esc(v.d)}" oninput="S.modal.v.d=this.value">
  ${v.rows.map((r,i)=>`<div class="card in" style="margin-top:10px"><div class="row"><input list="exlist" value="${esc(r.name)}" placeholder="Ejercicio" oninput="A.lr(${i},'name',this.value)"><button class="btn sm ghost" onclick="S.modal.v.rows.splice(${i},1);renderModal()">✕</button></div>
   <div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-top:6px"><div><label style="margin-top:0">kg</label><input type="number" inputmode="decimal" value="${esc(r.kg??'')}" oninput="A.lr(${i},'kg',this.value)"></div><div><label style="margin-top:0">Reps</label><input type="number" inputmode="numeric" value="${esc(r.reps??'')}" oninput="A.lr(${i},'reps',this.value)"></div><div><label style="margin-top:0">Series</label><input type="number" inputmode="numeric" value="${esc(r.sets??'')}" oninput="A.lr(${i},'sets',this.value)"></div><div><label style="margin-top:0">Fallos</label><input type="number" inputmode="numeric" value="${esc(r.miss||'')}" oninput="A.lr(${i},'miss',this.value)"></div></div>
   <label>RPE · esfuerzo percibido</label><div class="scale">${[6,7,8,9,10].map(n=>`<button class="${r.rpe===n?'on':''}" onclick="S.modal.v.rows[${i}].rpe=${n};renderModal()">${n}</button>`).join('')}</div>
   <div class="xs" style="margin-top:5px">${r.rpe?`<b>RPE ${r.rpe}:</b> ${RPE_TXT[r.rpe]}`:'<span class="mut">¿Qué tan pesado se sintió la serie más pesada? Elige según cuántas repeticiones más podrías haber hecho bien.</span>'}</div>

  ${(v.videos||[]).map((x,i)=>`<div class="row sp sm" style="margin-top:6px"><span>🎥 ${esc(x.name||'video')}</span><button class="btn sm ghost" onclick="S.modal.v.videos.splice(${i},1);renderModal()">Quitar</button></div>`).join('')}

 if(m.t==='goals'){const a=S.athletes[v.uid];return`<h2>Objetivos</h2><div class="sm mut">${esc(a?.name||'')}</div><label>Fecha objetivo</label><input type="date" value="${esc(v.date||'')}" oninput="S.modal.v.date=this.value"><div class="grid2">${['arranque','envion','sfrontal','strasera'].map(k=>`<div><label>${EXN[k]} (actual ${fk(a?.rms?.[k])})</label><input type="number" inputmode="decimal" value="${esc(v[k]??'')}" oninput="S.modal.v['${k}']=num(this.value)"></div>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn f1" onclick="A.saveGoals()">Guardar</button><button class="btn ghost" onclick="A.closeModal()">Cancelar</button></div>`}
 if(m.t==='comp')return`<h2>Nueva competencia</h2><label>Nombre</label><input value="${esc(v.name)}" placeholder="Ej: Campeonato Nacional" oninput="S.modal.v.name=this.value"><div class="grid2"><div><label>Fecha</label><input type="date" value="${esc(v.date)}" oninput="S.modal.v.date=this.value"></div><div><label>Lugar</label><input value="${esc(v.place)}" oninput="S.modal.v.place=this.value"></div></div><label>Nota</label><input value="${esc(v.notes)}" placeholder="Opcional (pesaje, horario…)" oninput="S.modal.v.notes=this.value">

  return`<h2>🏆 ${esc(x.name||'Competencia')}</h2><label>Atleta</label><select onchange="S.modal.v.u=this.value"><option value="">Elige…</option>${al.map(([u,a])=>`<option value="${u}" ${v.u===u?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
  <div class="grid2"><div><label>Peso corporal</label><input inputmode="decimal" value="${esc(v.bw)}" oninput="S.modal.v.bw=this.value"></div><div><label>Categoría</label><input value="${esc(v.cat)}" placeholder="Ej: 71 kg" oninput="S.modal.v.cat=this.value"></div></div>

async function readWb(file){if(!window.XLSX)throw new Error('xlsx');if(/\.csv$/i.test(file.name))return XLSX.read(await file.text(),{type:'string'});return XLSX.read(await file.arrayBuffer(),{type:'array'})}
async function parseExcel(file){return sheetsOf(await readWb(file))}
function sheetsOf(wb){
 return wb.SheetNames.slice(0,8).map(n=>{const raw=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});let rows=raw.slice(0,250).map(r=>({c:(r||[]).slice(0,30).map(v=>String(v??'').slice(0,120))}));
  while(rows.length&&rows[rows.length-1].c.every(v=>!v.trim()))rows.pop();
  const mc=Math.max(0,...rows.map(r=>{let i=r.c.length;while(i&&!r.c[i-1].trim())i--;return i}));rows.forEach(r=>{r.c=r.c.slice(0,mc);while(r.c.length<mc)r.c.push('')});
  return{name:n,rows}}).filter(s=>s.rows.length)}
A.xlsIn=async inp=>{const f=inp.files[0];inp.value='';if(!f)return;try{const wb=await readWb(f);const w=/\.csv$/i.test(f.name)?null:parseWeekly(wb);
  if(w){S.draft.weekly=w;S.draft.sheets=[];S.draft.sessions=wkSessions(w);const wd=wkWeekFromName(f.name);if(wd)S.draft.week=wd;if(!S.draft.title)S.draft.title=f.name.replace(/\.\w+$/,'').replace(/_+/g,' ');render();return toast('✅ Plani semanal lista: '+w.days.length+' días')}
  const sh=sheetsOf(wb);if(!sh.length)return toast('El archivo está vacío');S.draft.weekly=null;S.draft.sheets=sh;if(!S.draft.title)S.draft.title=f.name.replace(/\.\w+$/,'');render();toast(sh.length+' hoja(s) cargada(s)')}catch(e){console.error(e);toast(e.message==='xlsx'?'El lector de Excel no cargó. Revisa tu conexión y recarga.':'No se pudo leer el archivo.')}};
function wkWeekFromName(n){const m=norm(n).match(/(\d{1,2})\s*(?:-|_|al|a)\s*\d{1,2}[\s_-]*(?:de[\s_-]*)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/);if(!m)return null;const mi=WK_MES.indexOf(m[2]==='setiembre'?'septiembre':m[2]);const now=new Date();const d=new Date(now.getFullYear(),mi,+m[1],12);if(d-now>200*864e5)d.setFullYear(d.getFullYear()-1);else if(now-d>200*864e5)d.setFullYear(d.getFullYear()+1);return mondayOf(ymd(d))}
A.imgIn=async inp=>{const fs=[...inp.files];inp.value='';if(!fs.length)return;S.uploading=true;render();for(const f0 of fs){try{const f=await shrinkImage(f0);if(f.size>20*1024*1024){toast('Imagen muy grande');continue}const r=await upload(f);S.draft&&S.draft.images.push(r)}catch(e){errToast(e);break}}S.uploading=false;render()};

// --- seguimiento por coincidencia de plantilla (template matching) ---
function blGray(ctx,w,h){const d=ctx.getImageData(0,0,w,h).data;const g=new Float32Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=d[j]*.299+d[j+1]*.587+d[j+2]*.114;return g}
function blPatch(g,w,h,cx,cy,r){const n=2*r+1,p=new Float32Array(n*n);for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const X=Math.min(w-1,Math.max(0,Math.round(cx+x))),Y=Math.min(h-1,Math.max(0,Math.round(cy+y)));p[(y+r)*n+x+r]=g[Y*w+X]}return p}
function blMatch(g,w,h,tpl,r,px,py,sr){let best=1e18,bx=px,by=py;const n=2*r+1,S=new Map();
 for(let dy=-sr;dy<=sr;dy++)for(let dx=-sr;dx<=sr;dx++){const cx=Math.round(px)+dx,cy=Math.round(py)+dy;if(cx-r<0||cy-r<0||cx+r>=w||cy+r>=h)continue;let s=0;
  for(let y=-r;y<=r;y+=1){const row=(cy+y)*w,tr=(y+r)*n+r;for(let x=-r;x<=r;x+=1){const d=g[row+cx+x]-tpl[tr+x];s+=d*d}if(s>best)break}
  S.set(dx+','+dy,s);if(s<best){best=s;bx=cx;by=cy}}
 // refinamiento subpíxel (parábola)
 const f=(dx,dy)=>S.get((bx-Math.round(px)+dx)+','+(by-Math.round(py)+dy));const l=f(-1,0),rr=f(1,0),u=f(0,-1),d=f(0,1);let ox=0,oy=0;
 if(l!=null&&rr!=null){const q=l-2*best+rr;if(q>0)ox=Math.max(-.5,Math.min(.5,(l-rr)/(2*q)))}if(u!=null&&d!=null){const q=u-2*best+d;if(q>0)oy=Math.max(-.5,Math.min(.5,(u-d)/(2*q)))}
 return{x:bx+ox,y:by+oy,s:best/(n*n)}}
A.barRun=async()=>{if(BL.busy)return;BL.busy=true;BL.step=3;blRender();const v=BL.v;const[cx,cy]=BL.taps[0];const Rw=Math.max(4,Math.hypot(BL.taps[1][0]-cx,BL.taps[1][1]-cy));
 const k=Math.min(1,14/Rw);const tw=Math.max(80,Math.round(BL.W*k)),th=Math.round(BL.H*tw/BL.W);const sc=tw/BL.W;const R=Math.max(5,Math.round(Rw*sc));
 const cv=document.createElement('canvas');cv.width=tw;cv.height=th;const cx2=cv.getContext('2d',{willReadFrequently:true});
 const prev=$('#blc');if(prev){prev.width=BL.W;prev.height=BL.H}const pctx=prev&&prev.getContext('2d');
 const dtv=1/30;const maxT=Math.min(v.duration,BL.t0+Math.min(8*BL.slow,v.duration));const N=Math.max(2,Math.floor((maxT-BL.t0)/dtv));
 await blSeek(BL.t0);cx2.drawImage(v,0,0,tw,th);let g=blGray(cx2,tw,th);
 // primer cuadro guardado para dibujar la trayectoria
 const first=document.createElement('canvas');first.width=BL.W;first.height=BL.H;first.getContext('2d').drawImage(v,0,0,BL.W,BL.H);BL.first=first;
 let p={x:cx*sc,y:cy*sc},vel={x:0,y:0};let tpl=blPatch(g,tw,th,p.x,p.y,R);const tpl0=tpl.slice();const pts=[{t:0,x:p.x,y:p.y}];const sc0=[];
 for(let i=1;i<=N;i++){if(!BL.busy)return;await blSeek(BL.t0+i*dtv);cx2.drawImage(v,0,0,tw,th);g=blGray(cx2,tw,th);
  const sr=Math.round(Math.min(R*1.6,R*0.6+Math.hypot(vel.x,vel.y)*0.8+4));const m=blMatch(g,tw,th,tpl,R,p.x+vel.x,p.y+vel.y,sr);
  if(sc0.length<5)sc0.push(m.s);const base=sc0.slice().sort((a,b)=>a-b)[Math.floor(sc0.length/2)]||1;if(i>5&&m.s>base*8+400){break}
  vel={x:m.x-p.x,y:m.y-p.y};p={x:m.x,y:m.y};pts.push({t:i*dtv/BL.slow,x:p.x,y:p.y});
  const np=blPatch(g,tw,th,p.x,p.y,R);for(let j=0;j<tpl.length;j++)tpl[j]=tpl[j]*.8+np[j]*.1+tpl0[j]*.1;
  if(i%3===0){const b=$('#blp');if(b)b.style.width=Math.round(i/N*100)+'%';const tt=$('#blpt');if(tt)tt.textContent='Cuadro '+i+' de '+N;if(pctx){pctx.drawImage(v,0,0,BL.W,BL.H);pctx.strokeStyle='#ffcf1f';pctx.lineWidth=3;pctx.beginPath();pts.forEach((q,j)=>j?pctx.lineTo(q.x/sc,q.y/sc):pctx.moveTo(q.x/sc,q.y/sc));pctx.stroke()}await new Promise(r=>setTimeout(r,0))}}
 BL.busy=false;if(pts.length<8){BL.step=2;blRender();return toast('No pude seguir el disco. Prueba marcando de nuevo o con un video más estable.')}
 BL.res=blMetrics(pts,R/((BL.disc/100)/2),sc);BL.step=4;blRender()};
function blSmooth(a,k){return a.map((_,i)=>{let s=0,n=0;for(let j=i-k;j<=i+k;j++)if(a[j]!=null){s+=a[j];n++}return s/n})}
function blMetrics(pts,ppm,sc){const t=pts.map(p=>p.t);const x0=pts[0].x,y0=pts[0].y;let X=pts.map(p=>BL.face*(p.x-x0)/ppm),Y=pts.map(p=>(y0-p.y)/ppm);X=blSmooth(X,1);Y=blSmooth(Y,1);
 const n=Y.length;const vy=Y.map((_,i)=>{const a=Math.max(0,i-1),b=Math.min(n-1,i+1);return(Y[b]-Y[a])/((t[b]-t[a])||1)});const vys=blSmooth(vy,1);
 const ay=vys.map((_,i)=>{const a=Math.max(0,i-1),b=Math.min(n-1,i+1);return(vys[b]-vys[a])/((t[b]-t[a])||1)});
 let iH=Y.indexOf(Math.max(...Y));{let pk=0;for(let i=1;i<n;i++){if(Y[i]>Y[pk])pk=i;else if(Y[pk]>0.1&&Y[i]<Y[pk]-0.03){iH=pk;break}}}const hmax=Y[iH];const pull=vys.slice(0,iH+1);const vmax=Math.max(0,...pull);const iV=pull.indexOf(vmax);
 let iC=iH;for(let i=iH+1;i<n-1;i++){if(Y[i]<=Y[i-1]&&Y[i]<=Y[i+1]){iC=i;break}if(i===n-2)iC=n-1}
 const xs=X.slice(0,iH+1);const toward=Math.min(0,...xs),away=Math.max(0,...xs);
 const m=+String(BL.kg).replace(',','.')||0;const P=vys.map((v,i)=>m*(9.81+ay[i])*v);const pmax=m?Math.max(0,...P.slice(0,iH+1)):0;const fmax=m?Math.max(...ay.slice(0,iH+1).map(a=>m*(9.81+a))):0;
 // sentadilla: fase concéntrica desde el punto más bajo
 let vconc=null;if(BL.ex==='sfrontal'||BL.ex==='strasera'){const iL=Y.indexOf(Math.min(...Y));let iT=iL;for(let i=iL;i<n;i++)if(Y[i]>=Y[iT])iT=i;if(iT>iL+1){vconc=(Y[iT]-Y[iL])/(t[iT]-t[iL])}}
 return{t,X,Y,vy:vys,iH,iV,iC,hmax,vmax,tPeak:t[iV],drop:hmax-Y[iC],toward,away,catchX:X[iC],pmax,fmax,vconc,m}}
function blTips(r){const T=[];const ex=BL.ex;const a=S.athletes[BL.u]||{};const rm=a.rms&&a.rms[ex];const pc=r.m&&rm?Math.round(r.m/rm*100):null;
 if(ex==='arranque'){if(r.vmax<1.5)T.push(['⚡','Velocidad baja ('+r.vmax.toFixed(2)+' m/s)','En el arranque la barra suele pasar 1,6–2,1 m/s. Trabaja la extensión explosiva del segundo tirón (arranque colgado, tirones rápidos).']);else T.push(['✅','Buena velocidad','Pico de '+r.vmax.toFixed(2)+' m/s, dentro de lo esperado para el arranque.'])}

async function loadRank(){if(S.rankBusy)return;S.rankBusy=true;try{S.rank=await call('ranking');S.rankErr=null}catch(e){S.rankErr=(e&&e.message)||'No se pudo cargar el ranking'}S.rankBusy=false;if(S.tab==='rank')softRender()}

 let h=`<div class="row sp"><h1 style="margin:0">Ranking 🏆</h1><button class="btn sm ghost" onclick="loadRank()">${S.rankBusy?'…':'↻'}</button></div><div class="sm mut" style="margin-bottom:10px">Halterofilia USACH</div>`;
 h+=`<div class="seg" style="margin-bottom:10px">${[['fuerza','💪 Fuerza'],['cumple','✅ Plani'],['progreso','📈 Progreso']].map(([x,l])=>`<button class="${k.tab===x?'on':''}" onclick="S.rk.tab='${x}';render()">${l}</button>`).join('')}</div>`;
 if(!R)return h+(S.rankErr?`<div class="card"><div class="mut">${esc(S.rankErr)}</div><button class="btn sm" style="margin-top:8px" onclick="loadRank()">Reintentar</button></div>`:'<div class="loading">Cargando ranking…</div>');
 let rows=[],fmt,sub,desc;
 if(k.tab==='fuerza'){
  h+=`<div class="tabs">${[['sinclair','Sinclair'],['total','Total'],['arranque','Arranque'],['envion','Envión'],['strasera','Sentadilla']].map(([x,l])=>`<button class="${k.lift===x?'on':''}" onclick="S.rk.lift='${x}';render()">${l}</button>`).join('')}</div>`;
  if(k.lift!=='sinclair')h+=`<div class="tabs">${[['all','Todos'],['M','Hombres'],['F','Mujeres']].map(([x,l])=>`<button class="${k.sex===x?'on':''}" onclick="S.rk.sex='${x}';render()">${l}</button>`).join('')}</div>`;
  const f={sinclair:r=>r.arranque&&r.envion&&r.bw&&r.sex?sinclair(r.arranque+r.envion,r.bw,r.sex):null,total:r=>r.arranque&&r.envion?r.arranque+r.envion:null,arranque:r=>r.arranque,envion:r=>r.envion,strasera:r=>r.strasera}[k.lift];
  rows=R.filter(r=>k.lift==='sinclair'||k.sex==='all'||r.sex===k.sex).map(r=>({r,v:f(r)})).filter(x=>x.v).sort((a,b)=>b.v-a.v);
  fmt=x=>k.lift==='sinclair'?fk(Math.round(x.v*10)/10):fk(x.v)+' kg';
  sub=x=>k.lift==='sinclair'?fk(x.r.arranque+x.r.envion)+' kg de total':'';
  desc={sinclair:'Puntos Sinclair: compara a todos sin importar peso corporal ni sexo.',total:'Arranque + envión.',arranque:'Mejor RM de arranque.',envion:'Mejor RM de envión.',strasera:'Mejor RM de sentadilla trasera.'}[k.lift]}
 else if(k.tab==='cumple'){
  rows=R.filter(r=>r.planned||r.dias).map(r=>({r,v:r.pct})).sort((a,b)=>(b.r.pct??-1)-(a.r.pct??-1)||b.r.dias-a.r.dias);
  fmt=x=>x.r.pct!=null?x.r.pct+'%':x.r.dias+' días';
  sub=x=>(x.r.planned?x.r.done+' de '+x.r.planned+' sesiones de la plani · ':'')+x.r.dias+' días entrenados';
  desc='Sesiones de la plani registradas en las últimas 4 semanas.'}
 else{
  rows=R.filter(r=>r.has).map(r=>({r,v:r.gain})).sort((a,b)=>b.r.gain-a.r.gain||(b.r.gainPct||0)-(a.r.gainPct||0));
  fmt=x=>(x.r.gain>0?'+':'')+fk(x.r.gain)+' kg';
  sub=x=>x.r.gainPct?(x.r.gainPct>0?'+':'')+fk(x.r.gainPct)+'% en arranque + envión':'arranque + envión';
  desc='Kilos que subió en arranque + envión en los últimos 3 meses.'}
 h+=`<div class="xs mut" style="margin:2px 0 4px">${desc}</div>`;
 if(!rows.length)return h+`<div class="card" style="text-align:center"><div style="font-size:34px">🏋️</div><div class="mut">Todavía no hay datos para este ranking.<br>${k.tab==='fuerza'?'Cada atleta debe completar su perfil con sus RM'+(k.lift==='sinclair'?', peso y sexo':'')+'.':k.tab==='cumple'?'Se llena cuando registran sus entrenamientos de la plani.':'Se llena a medida que suben sus RM.'}</div></div>`;
 const nm=n=>{const p=String(n||'').trim().split(/\s+/);return p[0]+(p[1]?' '+p[1][0]+'.':'')};

 const top=rows.slice(0,3);
 h+=`<div class="podium">${[1,0,2].map(i=>{const x=top[i];if(!x)return'<div class="pd"></div>';const n=x.r.name;return`<div class="pd p${i+1} ${x.r.id===me?'me':''} ${coach?'click':''}" ${op(x.r.id)}><div class="av" style="background:${avc(n)}26;color:${avc(n)}">${esc(initials(n))}</div><div class="nm">${['🥇','🥈','🥉'][i]} ${esc(nm(n))}</div><div class="vl">${fmt(x)}</div><div class="blk">${i+1}</div></div>`}).join('')}</div>`;

 return h+'</div>'}

 else if(!L.name)return toast(L.step==='reg'?'Escribe tu nombre y apellido':'Toca tu nombre en la lista');
 S.lgBusy=true;render();
 try{let r;if(!S.coachSet){r=await call('setupCoach',{name:L.name,pass:L.pass});S.coachSet=true}

 catch(e){S.lgBusy=false;render();toast(e.message||'Error')}};

/* ===================== plani semanal desde el Excel del profe ===================== */
const WK_DAYS=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const WK_FIX={FZA:'fuerza',MECINAL:'medicinal',TODILLO:'tobillo',EXTENCION:'extensión',EXTENSION:'extensión',FLEXION:'flexión',ROTACION:'rotación',ABDUCCION:'abducción',DORSIFLEXION:'dorsiflexión',BALON:'balón',TRACCION:'tracción',ENVION:'envión',HALON:'halón',ESTABILIZACION:'estabilización',CINTURA:'cintura',MANCUERNAS:'mancuernas',INCLINADO:'inclinado',HIPER:'hiper',C:'c/'};
function wkCap(s){s=String(s||'').replace(/\s+/g,' ').trim();if(!s)return'';const w=s.split(' ').map(t=>{const k=t.replace(/[^A-ZÁÉÍÓÚÑ]/gi,'').toUpperCase();const pre=t.match(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ]*/)[0],post=t.match(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]*$/)[0];
  if(WK_FIX[k]&&k!=='C')return pre+WK_FIX[k]+post;return/[a-z]/.test(t)?t:t.toLowerCase()}).join(' ');return w[0].toUpperCase()+w.slice(1)}
const wkNum=v=>{if(v==null||v==='')return 0;const n=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const wkStr=v=>typeof v==='string'?v.trim():'';
const wkGrid=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
/* hojas con columnas de % (Arranque y envión, Sentadilla, Halón) */
function wkPctSheet(g,kind){
  let pr=-1;for(let r=0;r<Math.min(6,g.length);r++){const n=(g[r]||[]).filter(v=>typeof v==='number'&&v>=0.3&&v<=1.5).length;if(n>=6){pr=r;break}}
  if(pr<0)return[];const row=g[pr];const cols=[];
  for(let c=0;c<row.length;c++){const v=row[c];if(typeof v==='number'&&v>=0.3&&v<=1.5&&row[c+1]===v&&row[c-1]!==v)cols.push([c,Math.round(v*100)])}
  if(cols.length<3)return[];
  let nameC=-1,dayC=-1;for(let r=pr;r<pr+4&&r<g.length;r++)(g[r]||[]).forEach((v,c)=>{const s=norm(wkStr(v));if(s==='kg'&&nameC<0)nameC=c;if(s==='dia'&&dayC<0)dayC=c});
  if(nameC<0)nameC=5;if(dayC<0)dayC=nameC-1;
  const out=[];let day=null;
  for(let r=pr+1;r<g.length;r++){const R=g[r]||[];const dv=R[dayC];if(typeof dv==='number'&&dv>=1&&dv<=7)day=dv;
    const nm=wkStr(R[nameC]);if(!nm||day==null||/^(kg|dia)$/i.test(nm))continue;const V=g[r+1]||[];
    const sets=cols.map(([c,p])=>({p,r:wkNum(V[c]),s:wkNum(V[c+1])})).filter(x=>x.r>0&&x.s>0);if(!sets.length)continue;
    let name=wkCap(nm),base;const n=norm(nm);
    if(kind==='sq'){base=/front/.test(n)?'sfrontal':'strasera';name='Sentadilla '+name.toLowerCase()}
    else if(kind==='hal'){base=/arr|snatch/.test(n)?'arranque':'cargada';name='Halón de '+name.toLowerCase()}
    else base=/arranque|snatch/.test(n)?'arranque':'envion';
    out.push({day,name,base,kind,sets})}
  return out}
/* movilidad y estabilización (hoja Introducción) */
function wkIntro(g){const out={};
  for(let r=0;r<g.length;r++)(g[r]||[]).forEach((v,c)=>{const s=norm(wkStr(v)).replace(/\s/g,'');const di=['lunes','martes','miercoles','jueves','viernes','sabado'].indexOf(s);if(di<0)return;
    const mov=[],est=[];let inEst=false;
    for(let k=r+1;k<Math.min(g.length,r+16);k++){const R=g[k]||[];const lab=wkStr(R[c]),nm=wkStr(R[c+1]);if(/^dia$/i.test(lab))break;
      if(/movilidad/i.test(lab)||/movilidad/i.test(nm))continue;
      if(/estabilizaci/i.test(nm)){inEst=true;if(lab)est.note=lab;continue}
      if(!nm)continue;const se=wkNum(R[c+2]),re=wkNum(R[c+3]);
      if(inEst||!/ejercicio/i.test(lab)){est.push({name:wkCap(nm),s:se,note:lab||est.note||''})}
      else{const m=nm.match(/^([^(]+)\(([^)]*)\)/);mov.push({zone:wkCap(m?m[1]:nm),det:m?wkCap(m[2]).toLowerCase():'',s:se,r:re})}}
    out[di]={mov,est}});
  return out}
/* musculación: bloques "DIA n" con PESO / SERIES / REPS */
function wkMusc(g){const out={};
  for(let r=0;r<g.length;r++)(g[r]||[]).forEach((v,c)=>{const m=/^dia\s*(\d)$/i.exec(wkStr(v));if(!m)return;const H=g[r];
    let ec=-1;for(let k=c+1;k<=c+3;k++)if(/ejercicio/i.test(wkStr(H[k])))ec=k;if(ec<0)return;
    const tri=[];for(let k=ec+1;k<ec+20;k++){const h=norm(wkStr(H[k]));if(/^dia/.test(h)||/total/.test(h))break;if(/^peso/.test(h))tri.push(k)}
    const groups=[];let grp=null;
    for(let k=r+1;k<Math.min(g.length,r+20);k++){const R=g[k]||[];if((R.slice(c,ec+12)).some(x=>/^dia\s*\d$/i.test(wkStr(x))))break;
      const gl=wkStr(R[c]);if(gl){grp={g:wkCap(gl),items:[]};groups.push(grp)}
      const nm=wkStr(R[ec]);if(!nm||!grp)continue;
      const parts=tri.map(p=>({kg:wkNum(R[p]),s:wkNum(R[p+1]),r:wkNum(R[p+2])})).filter(x=>x.s>0&&x.r>0);if(!parts.length)continue;
      const kgs=[...new Set(parts.map(x=>x.kg).filter(x=>x>0))];
      grp.items.push({name:wkCap(nm),sr:parts.map(x=>x.s+'×'+x.r).join(' + '),kg:kgs.length?kgs.map(fk).join(' / ')+' kg':''})}
    out[+m[1]]=groups.filter(x=>x.items.length)});
  return out}
function parseWeekly(wb){
  const find=re=>wb.SheetNames.find(n=>re.test(norm(n)));
  const sAE=find(/arranque|envion/),sSQ=find(/sentadilla/),sHA=find(/halon/),sMU=find(/muscula/),sIN=find(/introduc|movilidad/);
  if(!sAE&&!sSQ&&!sHA)return null;
  const ol=[...(sAE?wkPctSheet(wkGrid(wb.Sheets[sAE]),'oly'):[]),...(sHA?wkPctSheet(wkGrid(wb.Sheets[sHA]),'hal'):[]),...(sSQ?wkPctSheet(wkGrid(wb.Sheets[sSQ]),'sq'):[])];
  if(!ol.length)return null;
  const intro=sIN?wkIntro(wkGrid(wb.Sheets[sIN])):{};const musc=sMU?wkMusc(wkGrid(wb.Sheets[sMU])):{};
  const days=[];
  for(let d=0;d<6;d++){const olim=ol.filter(x=>x.day===d+1).map(({name,base,kind,sets})=>({name,base,kind,sets}));
    const mg=musc[d+1]||[];const warmG=mg.filter(x=>/salto|core/i.test(x.g)),mainG=mg.filter(x=>!/salto|core/i.test(x.g));
    const it=intro[d]||{mov:[],est:[]};
    if(!olim.length&&!mg.length&&d===5)continue;
    days.push({name:WK_DAYS[d],olim,mov:it.mov,est:it.est,jump:warmG,musc:mainG,muscDay:mg.length?d+1:null})}
  return{days}}
/* sesiones para registrar cada día (y para el % de cumplimiento) */
function wkSessions(w){return(w.days||[]).filter(d=>d.olim.length).map(d=>({name:wkCap(d.name),items:d.olim.map(o=>({name:o.name,base:o.base,scheme:o.sets.map(x=>x.p+'/'+x.r+'x'+x.s).join(', '),notes:''}))}))}
/* ---------- vista ---------- */
const WK_MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function wkRange(p){const w=p.weekly;if(!w||!p.week)return'';const n=w.days.length;const a=dt(p.week),b=dt(addDays(p.week,Math.max(4,n-1)));
  return a.getMonth()===b.getMonth()?`${a.getDate()} al ${b.getDate()} de ${WK_MES[b.getMonth()]}`:`${a.getDate()} de ${WK_MES[a.getMonth()]} al ${b.getDate()} de ${WK_MES[b.getMonth()]}`}
const wkDate=(p,i)=>p.week?fmtD(addDays(p.week,i),{day:'numeric',month:'short'}).replace('.',''):'';
const wkRm=(a,b)=>a&&a.rms?(a.rms[b]||(b==='cargada'?a.rms.envion:null)||null):null;
const wkKg=(a,b,p)=>{const rm=wkRm(a,b);return rm?rnd(rm*p/100,a.step||1):null};
const WKB={arranque:'% arranque',envion:'% envión',cargada:'% clean',sfrontal:'% s. frontal',strasera:'% s. trasera'};
function wkSecs(d,a,img){const ch=(t,cls)=>`<span class="wch${cls?' '+cls:''}">${t}</span>`;let h='';
  const se=[];(d.jump||[]).forEach(g=>g.items.forEach(i=>se.push([g.g,i.name,i.sr+(i.kg?' · '+i.kg:'')])));(d.est||[]).forEach(e=>se.push(['Estabilización',e.name,(e.s?e.s+' series':'')+(e.note?' · '+e.note.replace(/X/g,'×'):'')]));
  if(se.length)h+=`<div class="wsec" style="--wc:#1fb5b0"><div class="wst">Saltos y estabilización</div>${se.map(([g,n,v])=>`<div class="wit"><div class="wn">${esc(n)}</div><div class="wv">${esc(v)}</div></div>`).join('')}</div>`;
  if((d.mov||[]).length)h+=`<div class="wsec" style="--wc:#4f8fe8"><div class="wst">Movilidad articular</div>${d.mov.map(m=>`<div class="wit"><div class="wn">${esc(m.zone)}${m.det?` <span class="wd">${esc(m.det)}</span>`:''}</div><div class="wv">${m.s?m.s+(m.r?'×'+m.r:' series'):''}</div></div>`).join('')}</div>`;
  if((d.olim||[]).length)h+=`<div class="wsec" style="--wc:#f07c1f"><div class="wst">Halterofilia</div>${d.olim.map(o=>`<div class="wit wol"><div class="wn">${esc(o.name.replace(/\s*\+\s*/g,' + '))} <span class="wd">${WKB[o.base]||''}</span></div><div class="wchs">${o.sets.map(x=>{const kg=wkKg(a,o.base,x.p);return ch(`<b>${x.p}%</b> ${x.s}×${x.r}${kg!=null?` <i>${fk(kg)} kg</i>`:''}`,x.p>=90?'hi':'')}).join('')}</div></div>`).join('')}</div>`;
  if((d.musc||[]).length)h+=`<div class="wsec" style="--wc:#0a3d7a"><div class="wst">Musculación${d.muscDay?' · Día '+d.muscDay:''}</div>${d.musc.map(g=>`<div class="wg">${esc(g.g)}</div>${g.items.map(i=>`<div class="wit"><div class="wn">${esc(i.name)}</div><div class="wv">${esc(i.sr)}${i.kg?` · <b>${esc(i.kg)}</b>`:''}</div></div>`).join('')}`).join('')}</div>`;
  return h||'<div class="mut sm">Descanso</div>'}
function wkView(id,p,a){const w=p.weekly;const c=role()==='coach';let si=0;const days=w.days.map((d,i)=>({...d,i,si:d.olim.length?si++:null}));
  const today=p.week?Math.round((dt(ymd())-dt(p.week))/864e5):-1;if(S.wkFor!==id){S.wkFor=id;S.wkDay=today>=0&&today<days.length?today:0}
  const d=days[Math.min(S.wkDay,days.length-1)];const done=d.si!=null&&!c&&a&&(a.lastLogs||[]).some(l=>l.planId===id&&l.s===d.si);
  return`<div class="card cc" style="--cc:#f07c1f"><div class="row sp"><div class="sec-t" style="margin:0">Plani semanal${wkRange(p)?' · '+wkRange(p):''}</div></div>
  <div class="tabs" style="margin-top:8px">${days.map(x=>`<button class="${x.i===d.i?'on':''}" onclick="S.wkDay=${x.i};render()">${x.name.slice(0,3)}${p.week?' '+dt(addDays(p.week,x.i)).getDate():''}</button>`).join('')}</div>
  <div class="row sp" style="margin:4px 0 8px"><h3 style="margin:0">${d.name[0]+d.name.slice(1).toLowerCase()} ${wkDate(p,d.i)}</h3>${!c&&d.si!=null?`<button class="btn sm ${done?'sec':''}" onclick="A.logFrom('${id}',${d.si})">${done?'✓ Registrado':'Registrar'}</button>`:''}</div>
  <div class="wk">${wkSecs(d,a)}</div>
  <div class="row wrap" style="margin-top:10px;gap:8px"><button class="btn f1" onclick="A.wkImg('${id}')">📷 Imagen de la semana</button></div>
  <div class="xs mut" style="margin-top:6px">Halterofilia: % del RM · series × reps${a&&a.rms&&Object.keys(a.rms).length?' · kilos calculados con los RM de '+esc(a.name):''}. Halón de clean usa tu RM de clean (o de envión si no lo tienes).</div></div>`}
/* imagen de la semana (para WhatsApp) */
let h2cP=null;const loadH2C=()=>h2cP||(h2cP=new Promise((res,rej)=>{if(window.html2canvas)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=()=>{h2cP=null;rej(new Error('No se pudo cargar el generador de imágenes. Revisa tu conexión.'))};document.head.appendChild(s)}));
function wkBoard(p,a){const w=p.weekly;const who=a&&a.rms&&Object.keys(a.rms).length&&role()!=='coach'?a.name:(role()==='coach'&&a&&S.wkImgKg?a.name:'');
  return`<div class="wkb"><div class="wkh"><img src="${LOGO_SRC}"><div class="f1"><div class="t">HALTEROFILIA <b>USACH</b></div><div class="s">Planificación semanal${wkRange(p)?' · '+wkRange(p):(p.title?' · '+esc(p.title):'')}</div></div>${who?`<div class="who">${esc(who)}</div>`:''}</div>
  <div class="wkc" style="grid-template-columns:repeat(${w.days.length},1fr)">${w.days.map((d,i)=>`<div class="wcol"><div class="wdh">${d.name}<span>${wkDate(p,i)}</span></div><div class="wk">${wkSecs(d,who?a:null)}</div></div>`).join('')}</div>
  <div class="wkf">Halterofilia: <b>% del RM · series × reps</b>${who?' · kilos según los RM de '+esc(who):''} &nbsp;·&nbsp; Halón: % del RM de arranque / clean &nbsp;·&nbsp; Musculación: <b>series × reps · peso</b> &nbsp;·&nbsp; <b>+</b> = complex</div></div>`}
A.wkImg=async id=>{const p=S.plans[id];if(!p||!p.weekly)return;const c=role()==='coach';const a=c?S.athletes[S.previewAth]:myA();toast('Generando imagen…');
  try{await loadH2C();const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:'+(p.weekly.days.length*360+48)+'px';box.innerHTML=wkBoard(p,a);document.body.appendChild(box);
   await new Promise(r=>setTimeout(r,120));const cv=await html2canvas(box.firstChild,{scale:1.6,backgroundColor:'#ffffff',useCORS:true,logging:false});box.remove();
   const name='Plani_USACH_'+(p.week||ymd())+'.png';const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],name,{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Plani semanal'});return}catch(e){if(e&&e.name==='AbortError')return}}
   const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Imagen descargada 📷')}
  catch(e){toast(e.message||'No se pudo generar la imagen')}};

boot();
</script>
